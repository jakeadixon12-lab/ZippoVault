<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZippoVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d0e15; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-surface { background-color: #191b26; border: 1px solid rgba(255, 255, 255, 0.08); }
    .bottom-nav { background-color: #12131c; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .drag-handle { touch-action: none; cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-32 select-none overflow-x-hidden">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-[#0d0e15]/95 backdrop-blur px-4 pt-4 pb-2 border-b border-white/5">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-fire text-amber-500 text-lg"></i>
        <h1 class="text-xl font-bold tracking-tight text-white">ZippoVault</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="closeAllWindowsBtn" onclick="closeAllInspectionWindows()" class="hidden text-[10px] bg-red-500/20 text-red-400 px-2 py-1 rounded border border-red-500/30">
          Close Windows (<span id="openWindowsCount">0</span>)
        </button>
        <span id="syncIndicator" class="text-[10px] text-gray-500 flex items-center gap-1">
          <i class="fa-solid fa-circle text-[8px] text-amber-500"></i> Local
        </span>
        <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="flex items-center gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
        <input id="searchInput" oninput="renderCollection()" type="text" placeholder="Search collection..."
               class="w-full bg-[#191b26] text-sm text-gray-200 pl-8 pr-3 py-1.5 rounded-full border border-white/10 focus:outline-none focus:border-amber-500">
      </div>
      <select id="filterTier" onchange="renderCollection()" class="bg-[#191b26] text-xs text-gray-300 py-2 px-2.5 rounded-full border border-white/10">
        <option value="ALL">All Lighters</option>
        <option value="COTY">COTY</option>
        <option value="ARMOR">Armor</option>
        <option value="VINTAGE">Vintage</option>
        <option value="STANDARD">Standard</option>
      </select>
    </div>
  </header>

  <!-- Main Vault Grid -->
  <main class="p-3">
    <div id="vaultGrid" class="grid grid-cols-3 gap-2.5"></div>
    <div id="emptyState" class="hidden text-center py-16 text-gray-500">
      <i class="fa-solid fa-box-open text-4xl mb-3"></i>
      <p class="text-sm">No Zippos in vault. Tap Scan to add one.</p>
    </div>
  </main>

  <!-- Dynamic Multi-Window Container -->
  <div id="floatingWindowsContainer" class="pointer-events-none fixed inset-0 z-40 overflow-hidden"></div>

  <!-- Adaptive Bottom Tray -->
  <aside id="batchTray" class="fixed bottom-16 inset-x-0 bg-[#161822] border-t border-white/10 px-4 py-2.5 flex items-center justify-between z-20 transition-all">
    <div class="flex items-center gap-2">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" class="w-4 h-4 rounded accent-amber-500 cursor-pointer">
      <label for="selectAllCheckbox" id="selectCount" class="text-xs text-gray-300 cursor-pointer">Select All (0)</label>
    </div>

    <div class="flex items-center gap-2">
      <div id="batchActionButtons" class="hidden flex items-center gap-1.5">
        <button id="batchAppraiseBtn" onclick="batchReappraiseSelected()" class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1.5 rounded-md hover:bg-amber-500/30 flex items-center gap-1 border border-amber-500/30">
          <i class="fa-solid fa-arrows-rotate"></i> <span>Re-Appraise</span>
        </button>
        <button onclick="deleteSelected()" class="bg-red-500/20 text-red-400 text-xs px-2.5 py-1.5 rounded-md hover:bg-red-500/30 border border-red-500/20">
          Delete
        </button>
        <button onclick="exportJSON()" class="bg-[#6366F1] text-white text-xs px-2.5 py-1.5 rounded-md font-medium hover:bg-indigo-600">
          Export
        </button>
      </div>

      <div class="text-right pl-2">
        <span class="text-[9px] text-gray-400 block -mb-0.5" id="totalLabel">Vault Total</span>
        <span id="selectedTotal" class="text-xs font-bold text-emerald-400">$0.00</span>
      </div>
    </div>
  </aside>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 h-16 bottom-nav flex items-center justify-around z-30 px-2">
    <button onclick="loadFromSupabase()" class="flex flex-col items-center text-gray-400 hover:text-white">
      <i class="fa-solid fa-rotate text-sm"></i>
      <span class="text-[10px] mt-1">Cloud Sync</span>
    </button>
    <button class="flex flex-col items-center text-amber-500 font-semibold">
      <i class="fa-solid fa-boxes-stacked text-sm"></i>
      <span class="text-[10px] mt-1">Vault</span>
    </button>
    <button onclick="openScanModal()" class="relative -top-3 bg-amber-500 text-black w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-amber-500/30 hover:scale-105 active:scale-95 transition">
      <i class="fa-solid fa-camera text-lg"></i>
    </button>
    <button onclick="openCOTYGuide()" class="flex flex-col items-center text-gray-400 hover:text-white">
      <i class="fa-solid fa-bell text-sm"></i>
      <span class="text-[10px] mt-1">COTY Drops</span>
    </button>
    <button onclick="toggleSettingsModal()" class="flex flex-col items-center text-gray-400 hover:text-white">
      <i class="fa-solid fa-sliders text-sm"></i>
      <span class="text-[10px] mt-1">Config</span>
    </button>
  </nav>

  <!-- Scan Modal -->
  <div id="scanModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-[#191b26] rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-4 border border-white/10 flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> Instant AI Scan & Add
        </h2>
        <button onclick="closeScanModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="grid grid-cols-2 gap-2 my-4">
        <div>
          <label class="block text-[11px] text-gray-400 mb-1">1. Front Face *</label>
          <input type="file" id="frontPhotoInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:bg-gray-800 file:text-gray-200">
        </div>
        <div>
          <label class="block text-[11px] text-amber-400 mb-1">2. Bottom Stamp *</label>
          <input type="file" id="stampPhotoInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:bg-gray-800 file:text-gray-200">
        </div>
      </div>

      <button id="runAiBtn" onclick="runAiIdentification()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-black font-semibold rounded-lg text-xs flex items-center justify-center gap-2 shadow-md">
        <span>Identify with AI</span>
      </button>

      <div class="mt-4 space-y-3 pt-3 border-t border-white/10">
        <div>
          <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Official Model / Name</label>
          <input type="text" id="formModel" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1">
        </div>
        
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Catalog #</label>
            <input type="text" id="formModelNum" placeholder="e.g. 48247" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1">
          </div>
          <div>
            <label class="block text-[10px] text-amber-400 uppercase tracking-wider">Edition / Make #</label>
            <input type="text" id="formEditionNum" placeholder="e.g. 05761/20020" class="w-full bg-[#12131c] text-xs text-amber-300 font-mono p-2 rounded border border-amber-500/30 mt-1">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Tier</label>
            <select id="formTier" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1">
              <option value="STANDARD">Standard</option>
              <option value="COTY">COTY</option>
              <option value="ARMOR">Armor</option>
              <option value="VINTAGE">Vintage</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Date & Bottom Stamp Decoding</label>
          <textarea id="formStampDetails" rows="2" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1"></textarea>
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Finish & Case Material</label>
          <input type="text" id="formFinish" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1">
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Artwork Details</label>
          <input type="text" id="formArtwork" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1">
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Market Analysis & Historical Comps</label>
          <textarea id="formMarketNotes" rows="2" placeholder="Market sources and pricing history..." class="w-full bg-[#12131c] text-xs text-gray-300 p-2 rounded border border-white/10 mt-1"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Condition</label>
            <select id="formCondition" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10 mt-1">
              <option value="Loose / Fired">Loose / Fired</option>
              <option value="Mint in Box">Mint in Box (Unfired)</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 uppercase tracking-wider">Est. Value ($)</label>
            <input type="number" id="formPrice" class="w-full bg-[#12131c] text-xs text-emerald-400 font-bold p-2 rounded border border-white/10 mt-1">
          </div>
        </div>
        <button id="saveVaultBtn" onclick="saveLighterToVault()" class="w-full py-2.5 bg-emerald-500 text-black font-bold text-xs rounded-lg mt-2">
          Add to Vault
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#191b26] rounded-2xl w-full max-w-sm p-4 border border-white/10 space-y-4">
      <div class="flex items-center justify-between border-b border-white/10 pb-2">
        <h3 class="text-sm font-bold text-white">Cloud & API Config</h3>
        <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Supabase Project URL</label>
        <input type="text" id="sbUrlInput" placeholder="https://xyz.supabase.co" class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Supabase Anon Key</label>
        <input type="password" id="sbKeyInput" placeholder="eyJhbGci..." class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-[#12131c] text-xs text-white p-2 rounded border border-white/10">
      </div>
      <button onclick="saveAllSettings()" class="w-full py-2 bg-amber-500 text-black text-xs font-semibold rounded">Save Credentials</button>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let collection = [];
    let selectedIds = new Set();
    let highestZIndex = 50;
    let windowCascadeOffset = 0;

    // Verified production models for fast OCR and low latency
    const ACTIVE_GEMINI_MODELS = [
      'gemini-2.5-flash',
      'gemini-3.5-flash',
      'gemini-3.1-pro-preview'
    ];

    function cleanSupabaseUrl(rawUrl) {
      if (!rawUrl) return '';
      let url = rawUrl.trim().replace(/\/+$/, '');
      url = url.replace(/\/rest\/v1$/, '').replace(/\/v1$/, '');
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      return url;
    }

    function initSupabase() {
      const rawUrl = localStorage.getItem('sb_url') || '';
      const key = (localStorage.getItem('sb_key') || '').trim();
      const indicator = document.getElementById('syncIndicator');

      const url = cleanSupabaseUrl(rawUrl);

      if (url && key) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
          indicator.innerHTML = '<i class="fa-solid fa-circle text-[8px] text-emerald-400"></i> Cloud Connected';
          loadFromSupabase();
          return;
        } catch (e) {
          console.error("Supabase init error", e);
        }
      }
      indicator.innerHTML = '<i class="fa-solid fa-circle text-[8px] text-amber-500"></i> Local Only';
      collection = JSON.parse(localStorage.getItem('zippo_vault_offline')) || [];
      renderCollection();
    }

    async function loadFromSupabase() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient
        .from('lighters')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Fetch error:", error);
        return;
      }

      collection = data.map(row => ({
        id: row.id,
        name: row.name,
        modelNumber: row.model_number,
        editionNumber: row.edition_number || '',
        year: row.year,
        tier: row.tier,
        stampDetails: row.stamp_details,
        finish: row.finish,
        artwork: row.artwork,
        condition: row.condition,
        price: Number(row.price),
        frontImg: row.front_img,
        stampImg: row.stamp_img,
        extraImgs: row.extra_imgs || [],
        marketNotes: row.market_notes || '',
        lastAppraisedAt: row.last_appraised_at || row.created_at || new Date().toISOString()
      }));

      localStorage.setItem('zippo_vault_offline', JSON.stringify(collection));
      renderCollection();
    }

    // Fast image compressor (850px max, 80% JPEG) for fast mobile transmission
    async function fileToCompressedBlob(file, maxDimension = 850) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              if (blob) resolve(blob);
              else reject(new Error("Canvas conversion failed"));
            }, 'image/jpeg', 0.80);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadImageToSupabase(file, prefix = 'lighter') {
      if (!supabaseClient || !file) return null;
      const randStr = Math.random().toString(36).substring(2, 8);
      const safeFileName = `${prefix}_${Date.now()}_${randStr}.jpg`;

      const compressedBlob = await fileToCompressedBlob(file);

      const { data, error } = await supabaseClient.storage
        .from('zippo-images')
        .upload(safeFileName, compressedBlob, {
          contentType: 'image/jpeg',
          cacheControl: '3600',
          upsert: true
        });

      if (error) {
        console.error("Storage upload error:", error);
        throw new Error(`Upload error on ${safeFileName}: ${error.message}`);
      }

      const { data: publicData } = supabaseClient.storage
        .from('zippo-images')
        .getPublicUrl(safeFileName);

      return publicData.publicUrl;
    }

    function renderCollection() {
      const grid = document.getElementById('vaultGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('filterTier').value;

      grid.innerHTML = '';
      const filtered = collection.filter(item => {
        const matchesSearch = (item.name || '').toLowerCase().includes(search) || 
                              (item.modelNumber && item.modelNumber.toLowerCase().includes(search)) ||
                              (item.editionNumber && item.editionNumber.toLowerCase().includes(search)) ||
                              (item.year && item.year.includes(search));
        const matchesTier = (filter === 'ALL') || (item.tier === filter);
        return matchesSearch && matchesTier;
      });

      if (filtered.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
      } else {
        document.getElementById('emptyState').classList.add('hidden');
      }

      filtered.forEach(item => {
        const isChecked = selectedIds.has(item.id);
        const card = document.createElement('div');
        card.className = "card-surface rounded-xl p-2 flex flex-col justify-between relative cursor-pointer active:scale-95 transition-transform";
        
        card.addEventListener('click', (e) => {
          if (e.target.tagName !== 'INPUT') openInspectionWindow(item.id);
        });

        const displayImg = item.frontImg || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=300";

        card.innerHTML = `
          <div class="relative w-full aspect-square rounded-lg overflow-hidden bg-black/40 mb-2">
            <span class="absolute top-1 left-1 bg-black/70 backdrop-blur text-[9px] font-bold text-amber-400 px-1.5 py-0.5 rounded border border-amber-500/20">${item.tier}</span>
            ${item.editionNumber ? `<span class="absolute bottom-1 left-1 bg-amber-500/90 text-black text-[8px] font-mono font-bold px-1 rounded truncate max-w-[85%]">${item.editionNumber}</span>` : ''}
            <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${item.id}')" class="absolute top-1 right-1 w-3.5 h-3.5 rounded accent-amber-500">
            <img src="${displayImg}" alt="${item.name}" class="w-full h-full object-cover pointer-events-none">
          </div>
          <div>
            <h3 class="text-[11px] font-bold text-gray-100 truncate">${item.name}</h3>
            <p class="text-[9px] text-amber-400/80">${item.modelNumber ? '#' + item.modelNumber : (item.year || '')}</p>
            <p class="text-xs font-extrabold text-emerald-400 mt-0.5">$${Number(item.price).toFixed(2)}</p>
          </div>
        `;
        grid.appendChild(card);
      });

      updateBatchTray();
    }

    // Floating Multi-Window Inspector
    function openInspectionWindow(id) {
      const item = collection.find(i => String(i.id) === String(id));
      if (!item) return;

      const container = document.getElementById('floatingWindowsContainer');
      const winId = `win_${item.id}_${Date.now()}`;
      highestZIndex += 1;

      const baseTop = 40 + (windowCascadeOffset % 120);
      const baseLeft = 15 + (windowCascadeOffset % 120);
      windowCascadeOffset += 28;

      const windowEl = document.createElement('div');
      windowEl.id = winId;
      windowEl.className = "pointer-events-auto absolute w-[90vw] max-w-[360px] bg-[#191b26] rounded-2xl shadow-2xl border border-white/20 flex flex-col max-h-[85vh] overflow-hidden select-none transition-shadow";
      windowEl.style.zIndex = highestZIndex;
      windowEl.style.top = `${baseTop}px`;
      windowEl.style.left = `${Math.min(baseLeft, window.innerWidth - 370 > 0 ? window.innerWidth - 370 : 15)}px`;

      windowEl.addEventListener('mousedown', () => bringWindowToFront(windowEl));
      windowEl.addEventListener('touchstart', () => bringWindowToFront(windowEl));

      renderWindowContent(windowEl, winId, item, false);

      container.appendChild(windowEl);
      bindDraggable(windowEl, windowEl.querySelector('.drag-handle'));
      updateWindowCountBadge();
    }

    function renderWindowContent(windowEl, winId, item, isEditing) {
      const extraImages = item.extraImgs || [];

      windowEl.innerHTML = `
        <div class="drag-handle bg-[#12131c] px-3.5 py-2.5 border-b border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-2 overflow-hidden mr-2">
            <i class="fa-solid fa-grip-lines text-gray-500 text-xs"></i>
            <span class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-amber-500/30 uppercase">${item.tier}</span>
            <span class="text-xs font-bold text-gray-200 truncate">${item.name}</span>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="reappraiseSingleLighter('${item.id}', '${winId}')" title="Re-Appraise Market Value" class="text-gray-400 hover:text-emerald-400 p-1 text-xs">
              <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button onclick="toggleCardEdit('${winId}', '${item.id}')" title="Edit Lighter" class="text-gray-400 hover:text-amber-400 p-1 text-xs">
              <i class="fa-solid ${isEditing ? 'fa-xmark' : 'fa-pen-to-square'}"></i>
            </button>
            <button onclick="closeInspectionWindow('${winId}')" class="text-gray-400 hover:text-white p-1">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>
        </div>

        <div class="p-3.5 overflow-y-auto space-y-3">
          ${isEditing ? renderEditForm(item, winId) : renderViewContent(item, winId, extraImages)}
        </div>
      `;

      bindDraggable(windowEl, windowEl.querySelector('.drag-handle'));
    }

    function renderViewContent(item, winId, extraImages) {
      const appraisalDate = item.lastAppraisedAt ? new Date(item.lastAppraisedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'Initial Scan';

      return `
        ${item.editionNumber ? `
          <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg px-2.5 py-1.5 flex items-center justify-between">

      if (windowEl) renderWindowContent(windowEl, winId, item, false);

    // High-speed text valuation engine using valid production models & zero thinking delay
    async function requestMarketValuation(item) {
      const apiKey = (localStorage.getItem('gemini_api_key_vault') || '').trim();
      if (!apiKey) throw new Error("Missing Gemini API Key");

      const prompt = `You are a certified Zippo lighter appraiser specializing in secondary market price indices.
Provide an updated, realistic secondary market valuation and comp breakdown for this specific lighter:
- Model Name: "${item.name}"
- Catalog SKU: "${item.modelNumber || 'N/A'}"
- Edition / Make Number: "${item.editionNumber || 'N/A'}"
- Year / Era: "${item.year || 'Modern'}"
- Tier: "${item.tier}"
- Condition: "${item.condition}"
- Recorded Finish/Art: "${item.finish} | ${item.artwork}"

Analyze secondary market trends (e.g. eBay completed sold comps, collector swap sheets, specialty retail MSRP vs appreciation).
Respond STRICTLY in raw JSON format with no markdown, backticks, or other text:
{
  "price": number (estimated fair secondary market value in USD as a plain number),
  "marketNotes": "Concise breakdown summarizing verified eBay completed sold comp benchmarks, MSRP delta, and collector liquidity."
}`;

      let lastError = null;

      for (const model of ACTIVE_GEMINI_MODELS) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { 
                response_mime_type: "application/json",
                thinking_config: { thinking_budget: 0 }
              }
            })
          });

          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          return JSON.parse(data.candidates[0].content.parts[0].text);
        } catch (err) {
          lastError = err;
          await new Promise(r => setTimeout(r, 200));
        }
      }
      throw lastError || new Error("Valuation service busy. Please try again.");
    }

    async function reappraiseSingleLighter(itemId, winId) {
      const item = collection.find(i => String(i.id) === String(itemId));
      if (!item) return;

      const windowEl = document.getElementById(winId);
      const refreshBtn = windowEl ? windowEl.querySelector('button[title="Re-Appraise Market Value"]') : null;
      if (refreshBtn) refreshBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-emerald-400"></i>';

      try {
        const valData = await requestMarketValuation(item);
        item.price = Number(valData.price) || item.price;
        item.marketNotes = valData.marketNotes || item.marketNotes;
        item.lastAppraisedAt = new Date().toISOString();

        if (supabaseClient) {
          await supabaseClient.from('lighters').update({
            price: item.price,
            market_notes: item.marketNotes,
            last_appraised_at: item.lastAppraisedAt
          }).eq('id', item.id);
        }

        localStorage.setItem('zippo_vault_offline', JSON.stringify(collection));
        renderCollection();
        if (windowEl) renderWindowContent(windowEl, winId, item, false);
      } catch (err) {
        alert("Valuation update failed: " + err.message);
      } finally {
        if (refreshBtn) refreshBtn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i>';
      }
    }

    async function batchReappraiseSelected() {
      if (selectedIds.size === 0) return;
      const count = selectedIds.size;
      if (!confirm(`Re-appraise current market values for ${count} selected lighter(s)?`)) return;

      const batchBtn = document.getElementById('batchAppraiseBtn');
      const originalHtml = batchBtn.innerHTML;
      batchBtn.disabled = true;

      const ids = Array.from(selectedIds);
      let successCount = 0;

      for (let i = 0; i < ids.length; i++) {
        const id = ids[i];
        const item = collection.find(l => String(l.id) === String(id));
        if (!item) continue;

        batchBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>${i + 1}/${count}</span>`;

        try {
          const valData = await requestMarketValuation(item);
          item.price = Number(valData.price) || item.price;
          item.marketNotes = valData.marketNotes || item.marketNotes;
          item.lastAppraisedAt = new Date().toISOString();

          if (supabaseClient) {
            await supabaseClient.from('lighters').update({
              price: item.price,
              market_notes: item.marketNotes,
              last_appraised_at: item.lastAppraisedAt
            }).eq('id', item.id);
          }
          successCount++;
        } catch (e) {
          console.warn(`Failed re-appraisal on ${item.name}`, e);
        }

        await new Promise(r => setTimeout(r, 250));
      }

      localStorage.setItem('zippo_vault_offline', JSON.stringify(collection));
      renderCollection();

      document.querySelectorAll('#floatingWindowsContainer > div').forEach(winEl => {
        const rawId = winEl.id.split('_')[1];
        const updatedItem = collection.find(l => String(l.id) === String(rawId));
        if (updatedItem) renderWindowContent(winEl, winEl.id, updatedItem, false);
      });

      batchBtn.innerHTML = originalHtml;
      batchBtn.disabled = false;
      alert(`Completed re-appraisal for ${successCount} of ${count} lighters.`);
    }

    function bindDraggable(windowEl, handleEl) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let initialLeft = 0;
      let initialTop = 0;

      function onStart(clientX, clientY) {
        isDragging = true;
        bringWindowToFront(windowEl);
        startX = clientX;
        startY = clientY;
        initialLeft = windowEl.offsetLeft;
        initialTop = windowEl.offsetTop;
      }

      function onMove(clientX, clientY) {
        if (!isDragging) return;
        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        let newLeft = initialLeft + deltaX;
        let newTop = initialTop + deltaY;

        const maxLeft = window.innerWidth - windowEl.offsetWidth - 5;
        const maxTop = window.innerHeight - windowEl.offsetHeight - 5;

        windowEl.style.left = `${Math.max(5, Math.min(newLeft, maxLeft))}px`;
        windowEl.style.top = `${Math.max(5, Math.min(newTop, maxTop))}px`;
      }

      function onEnd() {
        isDragging = false;
      }

      handleEl.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onEnd);

      handleEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          e.preventDefault();
          onMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      window.addEventListener('touchend', onEnd);
    }

    function updateBatchTray() {
      const count = selectedIds.size;
      const selectAllEl = document.getElementById('selectAllCheckbox');
      const selectCountEl = document.getElementById('selectCount');
      const actionButtons = document.getElementById('batchActionButtons');
      const totalLabelEl = document.getElementById('totalLabel');
      const totalEl = document.getElementById('selectedTotal');

      selectAllEl.checked = count > 0 && count === collection.length;
      selectCountEl.innerText = count > 0 ? `Selected (${count})` : `Select All (0)`;

      if (count > 0) {
        actionButtons.classList.remove('hidden');
        actionButtons.classList.add('flex');
        totalLabelEl.innerText = "Selected Sum";

        const selectedSum = Array.from(selectedIds).reduce((sum, id) => {
          const found = collection.find(i => String(i.id) === String(id));
          return sum + (found ? Number(found.price) : 0);
        }, 0);
        totalEl.innerText = `$${selectedSum.toFixed(2)}`;
      } else {
        actionButtons.classList.add('hidden');
        actionButtons.classList.remove('flex');
        totalLabelEl.innerText = "Vault Total";

        const portfolioSum = collection.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
        totalEl.innerText = `$${portfolioSum.toFixed(2)}`;
      }
    }

    function saveAllSettings() {
      const rawUrl = document.getElementById('sbUrlInput').value;
      const sbKey = document.getElementById('sbKeyInput').value.trim();
      const gemKey = document.getElementById('apiKeyInput').value.trim();

      const cleanedUrl = cleanSupabaseUrl(rawUrl);

      if (cleanedUrl) localStorage.setItem('sb_url', cleanedUrl);
      if (sbKey) localStorage.setItem('sb_key', sbKey);
      if (gemKey) localStorage.setItem('gemini_api_key_vault', gemKey);

      alert("Settings saved!");
      toggleSettingsModal();
      initSupabase();
    }

    // High-speed Dual-Image Vision Analyzer
    async function runAiIdentification() {
      const apiKey = (localStorage.getItem('gemini_api_key_vault') || '').trim();
      if (!apiKey) {
        alert("Please set your Gemini API key in Config first.");
        toggleSettingsModal();
        return;
      }

      const frontFile = document.getElementById('frontPhotoInput').files[0];
      const stampFile = document.getElementById('stampPhotoInput').files[0];

      if (!frontFile && !stampFile) {
        alert("Please select at least one photo (front face or bottom stamp).");
        return;
      }

      const runBtn = document.getElementById('runAiBtn');
      runBtn.disabled = true;

      try {
        const parts = [];
        const systemInstruction = `You are a certified Zippo lighter appraiser and historian.
Analyze the provided lighter image(s).

ZIPPO DATE CODE DECODING RULES:
- 2001 to Present: Left letter = Month (A=Jan, B=Feb, C=Mar, D=Apr, E=May, F=Jun, G=Jul, H=Aug, I=Sep, J=Oct, K=Nov, L=Dec). Right numbers = Last two digits of year (e.g., 23 = 2023, 18 = 2018).
- 1986 to 2000: Left letter = Month (A..L). Right = Roman numerals (II = 1986, XVI = 2000).
- 1958 to 1985: Dots and slashes flanking the Zippo logo.
- Location: "BRADFORD, PA. MADE IN U.S.A."

SPECIAL COTY & NUMBERED EDITIONS:
- Check if this lighter is an official Collectible of the Year (COTY) or limited edition.
- Look closely for any laser-engraved edition numbering sequence typically found on the side spine, bottom, or reverse face (e.g. 05761/20020 or 1234/12000). If present, output this exact string in "editionNumber".

JSON FORMAT:
{
  "name": "Full Official Model Name",
  "modelNumber": "5-digit catalog number or empty string",
  "editionNumber": "Limited edition numbering if visible (e.g. 05761/20020), otherwise empty string",
  "year": "Exact year (e.g. 2023)",
  "tier": "COTY or ARMOR or VINTAGE or STANDARD",
  "stampDetails": "Full explanation of stamp (e.g. Manufactured in January 2023. Letter A on left = January; 23 on right = 2023; Bradford, PA Made in U.S.A.)",
  "finish": "Case finish and metal",
  "artwork": "Artwork and engraving technique",
  "condition": "Loose / Fired or Mint in Box",
  "price": number,
  "marketNotes": "Detailed market intelligence summarizing eBay completed sales benchmarks, release MSRP vs current value, and appreciation trajectory."
}`;

        parts.push({ text: systemInstruction });

        if (frontFile) {
          const frontBlob = await fileToCompressedBlob(frontFile, 850);
          const reader = new FileReader();
          const frontBase64Promise = new Promise(resolve => {
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(frontBlob);
          });
          const frontBase64 = await frontBase64Promise;
          parts.push({ text: "PHOTO 1 (Front Artwork / Face):" });
          parts.push({ inline_data: { mime_type: 'image/jpeg', data: frontBase64 } });
        }

        if (stampFile) {
          const stampBlob = await fileToCompressedBlob(stampFile, 850);
          const reader = new FileReader();
          const stampBase64Promise = new Promise(resolve => {
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(stampBlob);
          });
          const stampBase64 = await stampBase64Promise;
          parts.push({ text: "PHOTO 2 (Bottom Stamp Close-up / Macro):" });
          parts.push({ inline_data: { mime_type: 'image/jpeg', data: stampBase64 } });
        }

        let success = false;
        let lastError = null;

        for (const model of ACTIVE_GEMINI_MODELS) {
          try {
            runBtn.innerText = `Scanning (${model.replace('gemini-', '')})...`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts }],
                generationConfig: { 
                  response_mime_type: "application/json",
                  thinking_config: { thinking_budget: 0 }
                }
              })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error.message);

            const parsed = JSON.parse(data.candidates[0].content.parts[0].text);

            document.getElementById('formModel').value = parsed.name || "Custom Zippo";
            document.getElementById('formModelNum').value = parsed.modelNumber || "";
            document.getElementById('formEditionNum').value = parsed.editionNumber || "";
            document.getElementById('formTier').value = parsed.tier || "STANDARD";
            document.getElementById('formStampDetails').value = parsed.stampDetails || "";
            document.getElementById('formFinish').value = parsed.finish || "";
            document.getElementById('formArtwork').value = parsed.artwork || "";
            document.getElementById('formMarketNotes').value = parsed.marketNotes || "";
            document.getElementById('formCondition').value = parsed.condition || "Loose / Fired";
            document.getElementById('formPrice').value = parsed.price || 35.00;

            success = true;
            break;
          } catch (err) {
            console.warn(`${model} failed:`, err);
            lastError = err;
            await new Promise(r => setTimeout(r, 200));
          }
        }

        if (!success) throw lastError || new Error("Gemini endpoints busy. Please try again.");

      } catch (err) {
        alert(`AI scan error: ${err.message || 'Check connection or key'}`);
      } finally {
        runBtn.innerText = "Identify with AI";
        runBtn.disabled = false;
      }
    }

    async function saveLighterToVault() {
      const saveBtn = document.getElementById('saveVaultBtn');
      saveBtn.innerText = "Uploading to Cloud...";
      saveBtn.disabled = true;

      try {
        const name = document.getElementById('formModel').value.trim() || "Untitled Zippo";
        const modelNumber = document.getElementById('formModelNum').value.trim();
        const editionNumber = document.getElementById('formEditionNum').value.trim();
        const tier = document.getElementById('formTier').value;
        const stampDetails = document.getElementById('formStampDetails').value.trim();
        const finish = document.getElementById('formFinish').value.trim();
        const artwork = document.getElementById('formArtwork').value.trim();
        const marketNotes = document.getElementById('formMarketNotes').value.trim();
        const condition = document.getElementById('formCondition').value;
        const price = parseFloat(document.getElementById('formPrice').value) || 30.00;
        const now = new Date().toISOString();

        let year = "Modern";
        const yearMatch = stampDetails.match(/\b(19\d{2}|20\d{2})\b/);
        if (yearMatch) year = yearMatch[1];

        const frontFile = document.getElementById('frontPhotoInput').files[0];
        const stampFile = document.getElementById('stampPhotoInput').files[0];

        let frontImgUrl = "https://images.unsplash.com/photo-1542838132-92c53300491e?w=300";
        let stampImgUrl = null;

        if (supabaseClient) {
          if (frontFile) frontImgUrl = await uploadImageToSupabase(frontFile, 'front');
          if (stampFile) stampImgUrl = await uploadImageToSupabase(stampFile, 'stamp');

          const payload = {
            name,
            model_number: modelNumber,
            year,
            tier,
            stamp_details: stampDetails,
            finish,
            artwork,
            market_notes: marketNotes,
            condition,
            price,
            front_img: frontImgUrl,
            stamp_img: stampImgUrl,
            extra_imgs: [],
            last_appraised_at: now
          };

          if (editionNumber) payload.edition_number = editionNumber;

          const { error } = await supabaseClient.from('lighters').insert([payload]);
          if (error) throw error;
          await loadFromSupabase();
        } else {
          collection.unshift({
            id: Date.now().toString(),
            name,
            modelNumber,
            editionNumber,
            year,
            tier,
            stampDetails,
            finish,
            artwork,
            marketNotes,
            condition,
            price,
            frontImg: frontImgUrl,
            stampImg: stampImgUrl,
            extraImgs: [],
            lastAppraisedAt: now
          });
          localStorage.setItem('zippo_vault_offline', JSON.stringify(collection));
          renderCollection();
        }

        closeScanModal();
        document.getElementById('frontPhotoInput').value = "";
        document.getElementById('stampPhotoInput').value = "";
        document.getElementById('formEditionNum').value = "";
        document.getElementById('formMarketNotes').value = "";
      } catch (err) {
        alert("Failed to save to cloud: " + err.message);
      } finally {
        saveBtn.innerText = "Add to Vault";
        saveBtn.disabled = false;
      }
    }

    function openCOTYGuide() {
      alert("Annual Collectible of the Year (COTY) Drop Tracker:\n\n• Timing: Every February - April\n• Primary Channel: Zippo.com (Z-Connect members)\n• Secondary Allocation: Riley's 66 & Lucas Lighters\n• Target MSRP: $120 - $160");
    }

    initSupabase();
  </script>
